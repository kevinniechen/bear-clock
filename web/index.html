<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>THE BEAR</title>
<meta name="theme-color" content="#07090d">
<style>
  :root {
    --bg: #07090d; --led: #2f7bff; --led-hot: #8fc1ff; --tape: #3d7fd9; --paper: #f4f1ea;
    --ink: #17181b; --steel: #1a1f27;
    --pad: max(18px, env(safe-area-inset-left));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body {
    min-height: 100dvh; color: #e8eefc; overflow-x: hidden;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 2px, transparent 2px 6px),
      radial-gradient(120% 60% at 50% 0%, #10182a 0%, var(--bg) 60%);
  }
  main {
    max-width: 440px; min-height: 100dvh; margin: 0 auto; display: flex; flex-direction: column;
    padding: max(22px, env(safe-area-inset-top)) var(--pad) max(16px, env(safe-area-inset-bottom));
  }

  /* LED clock */
  .clock {
    position: relative; margin: 4px 0 0; padding: 14px 10px 12px; border-radius: 10px;
    background: #03050a; border: 1px solid #141c2c;
    box-shadow: inset 0 0 0 4px #0a0f19, inset 0 0 40px rgba(47,123,255,.08);
  }
  .digits {
    font: 700 clamp(46px, 16.5vw, 76px)/1 ui-monospace, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums; letter-spacing: .02em; text-align: center;
    color: var(--led); text-shadow: 0 0 6px rgba(47,123,255,.9), 0 0 26px rgba(47,123,255,.45);
    transition: opacity .4s;
  }
  .clock::after { /* LED dot grid */
    content: ""; position: absolute; inset: 0; border-radius: 10px; pointer-events: none;
    background: radial-gradient(circle, transparent 55%, rgba(3,5,10,.55) 60%) 0 0 / 4px 4px;
  }
  .stale .digits { opacity: .28; }
  .paused .digits { animation: blink 1.2s steps(1) infinite; }
  .zero .digits { color: #ff4d5e; text-shadow: 0 0 8px rgba(255,77,94,.9), 0 0 26px rgba(255,77,94,.4);
    animation: blink .5s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  /* painter's tape */
  .tape {
    align-self: center; margin: 18px 0 26px; padding: 9px 22px 8px; transform: rotate(-1.6deg);
    background: linear-gradient(180deg, rgba(255,255,255,.12), transparent 40%), var(--tape);
    color: #0b1220; font: 700 clamp(17px, 5.2vw, 22px)/1 "Marker Felt", "Noteworthy", "Chalkboard SE", system-ui, sans-serif;
    letter-spacing: .02em; text-transform: uppercase; white-space: nowrap;
    clip-path: polygon(1% 6%, 4% 0, 97% 3%, 100% 10%, 99% 92%, 96% 100%, 3% 96%, 0 88%);
    box-shadow: 0 2px 0 rgba(0,0,0,.25);
  }

  /* ticket */
  .rail { position: relative; perspective: 800px; }
  .ticket {
    position: relative; background: var(--paper); color: var(--ink); padding: 14px 16px 26px;
    border-radius: 2px; box-shadow: 0 10px 30px rgba(0,0,0,.45);
    --tooth: 9px;
    -webkit-mask: linear-gradient(#000 0 0) top / 100% calc(100% - var(--tooth)) no-repeat,
                  conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / calc(2 * var(--tooth)) var(--tooth) repeat-x;
            mask: linear-gradient(#000 0 0) top / 100% calc(100% - var(--tooth)) no-repeat,
                  conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / calc(2 * var(--tooth)) var(--tooth) repeat-x;
  }
  .ticket.fired { animation: fire .55s cubic-bezier(.5,0,.75,0) forwards; }
  .ticket.fresh { animation: print .45s cubic-bezier(.2,.8,.2,1); }
  @keyframes fire { to { transform: translateY(-140%) rotate(-3deg); opacity: 0; } }
  @keyframes print { from { transform: translateY(18px); opacity: 0; } }
  .head { display: flex; justify-content: space-between; font-size: 12px; letter-spacing: .12em; opacity: .75; }
  .server { display: flex; align-items: baseline; gap: 8px; margin-top: 10px; font-size: 12px; letter-spacing: .12em; }
  .server span { opacity: .55; }
  .server input {
    flex: 1; min-width: 0; border: 0; border-bottom: 1.5px solid rgba(23,24,27,.25); border-radius: 0;
    background: transparent; color: var(--ink); outline: 0; padding: 2px 0;
    font: 700 16px/1.2 ui-monospace, "SF Mono", Menlo, monospace; text-transform: uppercase;
  }
  .server input::placeholder { color: rgba(23,24,27,.28); }
  .server input:focus { border-bottom-color: #c0262f; }
  .server.need input { border-bottom-color: #c0262f; }
  .rule { border: 0; border-top: 2px dashed rgba(23,24,27,.35); margin: 10px 0 8px; }
  textarea {
    display: block; width: 100%; height: 6.2em; resize: none; border: 0; outline: 0; padding: 0;
    background: transparent; color: var(--ink); caret-color: #c0262f;
    font: 700 22px/1.25 ui-monospace, "SF Mono", Menlo, monospace; text-transform: uppercase;
  }
  textarea::placeholder { color: rgba(23,24,27,.28); }
  .count { position: absolute; right: 16px; bottom: 16px; font-size: 11px; opacity: .45; }

  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 8px; margin: 22px 0 0; }
  .chips button {
    border: 0; padding: 7px 11px 6px; background: var(--tape); color: #0b1220; cursor: pointer;
    font: 700 14px/1 "Marker Felt", "Noteworthy", "Chalkboard SE", system-ui, sans-serif; text-transform: uppercase;
    clip-path: polygon(2% 8%, 5% 0, 96% 4%, 100% 12%, 98% 90%, 95% 100%, 4% 95%, 0 85%);
  }
  .chips button:nth-child(odd) { transform: rotate(-2deg); }
  .chips button:nth-child(even) { transform: rotate(1.5deg); }
  .chips button:active { filter: brightness(1.2); }

  .spacer { flex: 1; min-height: 20px; }
  .fire {
    width: 100%; height: 64px; border: 0; border-radius: 6px; cursor: pointer;
    background: linear-gradient(180deg, #ff5a3c, #d8321b); color: #fff;
    font: 800 22px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .3em; padding-left: .3em;
    box-shadow: 0 6px 0 #8f1d0d, 0 10px 24px rgba(216,50,27,.35); transition: transform .06s, box-shadow .06s;
  }
  .fire:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 #8f1d0d; }
  .fire:disabled { background: var(--steel); color: #6d7890; box-shadow: 0 6px 0 #0d1016; cursor: default; }
  .fire.heard { background: linear-gradient(180deg, #2f7bff, #1f5fd1); box-shadow: 0 6px 0 #133b85; color: #fff; }
  .err { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  /* staff photo */
  .snap {
    display: block; margin: 18px auto 0; padding: 10px 16px; border: 1.5px dashed #2a3c63; border-radius: 6px;
    background: transparent; color: var(--led-hot); cursor: pointer;
    font: 700 14px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .2em;
  }
  .snap:active { background: #0d1a33; }
  .wall { margin: 34px calc(-1 * var(--pad)) 0; padding: 26px var(--pad) 8px; border-top: 1px solid #141c2c;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 1px, transparent 1px 28px); }
  .wall .tape { margin: 0 0 18px; display: table; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 4px; }
  .grid img { width: 100%; display: block; cursor: pointer; }
  .grid img:nth-child(4n+1) { transform: rotate(-1.5deg); }
  .grid img:nth-child(4n+2) { transform: rotate(2deg) translateY(10px); }
  .grid img:nth-child(4n+3) { transform: rotate(1deg); }
  .grid img:nth-child(4n) { transform: rotate(-2deg) translateY(10px); }
  .sheet { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; padding: max(18px, env(safe-area-inset-top)) var(--pad) max(18px, env(safe-area-inset-bottom));
    background: rgba(4,6,10,.94); backdrop-filter: blur(6px); }
  .sheet[hidden] { display: none; }
  .sheet img { max-width: 100%; max-height: 68dvh; object-fit: contain; }
  .sheet .acts { display: flex; gap: 10px; width: 100%; max-width: 440px; }
  .sheet .acts button { flex: 1; height: 56px; border: 0; border-radius: 6px; cursor: pointer;
    font: 800 16px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .18em; }
  .sheet .keep { background: var(--steel); color: #dfe7f7; }
  .sheet .up { background: var(--tape); color: #0b1220; }
  .sheet .up:disabled { opacity: .5; }
  .sheet .x { position: absolute; top: max(14px, env(safe-area-inset-top)); right: var(--pad); width: 44px; height: 44px;
    border: 0; background: transparent; color: #8a96ad; font-size: 26px; cursor: pointer; }
  .sheet.busy img { opacity: .4; }

  @media (min-height: 760px) { .tape { margin: 26px 0 32px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <div class="clock" id="clock"><div class="digits" id="digits">--:--:--</div></div>
  <div class="tape">Every second counts</div>

  <form id="form" autocomplete="off">
    <div class="rail">
      <div class="ticket" id="ticket">
        <div class="head"><span id="num">#0000</span><span id="time"></span></div>
        <label class="server" id="server"><span>SERVER</span>
          <input id="name" maxlength="16" placeholder="YOUR NAME" autocomplete="given-name" enterkeyhint="next" aria-label="Your name"></label>
        <hr class="rule">
        <textarea id="text" maxlength="80" placeholder="YES CHEF" aria-label="Message for the clock" enterkeyhint="send"></textarea>
        <span class="count" id="n"></span>
      </div>
    </div>
    <div class="chips" id="chips"></div>
  </form>

  <div class="spacer"></div>
  <button class="fire" id="fire" form="form" type="submit">FIRE</button>
  <button class="snap" id="snap" type="button">📸 STAFF PHOTO</button>
  <input type="file" id="cam" accept="image/*" hidden>

  <section class="wall" id="wall" hidden>
    <div class="tape">The wall</div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<div class="sheet" id="sheet" hidden>
  <button class="x" id="sheetX" aria-label="Close">✕</button>
  <img id="preview" alt="">
  <div class="acts">
    <button class="keep" id="keep">KEEP</button>
    <button class="up" id="tapeUp">TAPE IT UP</button>
  </div>
</div>
<script>
// Public site: messages go through ntfy.sh to the clock. Served by the clock's
// own hotspot (http://192.168.4.1): talks to the board's local API instead.
const GUEST_TOPIC = "bearclock-a2039d53";
const NTFY = "https://ntfy.sh";
const LOCAL = location.protocol === "http:" && !["localhost", "127.0.0.1"].includes(location.hostname);
const COOLDOWN_S = 15;
const STALE_MS = 35 * 60 * 1000;  // board heartbeats every 15 min (ntfy daily cap)
const CHIPS = ["Yes chef", "Heard", "Behind", "Let it rip", "Cousin!"];

const $ = (id) => document.getElementById(id);
const text = $("text"), fire = $("fire"), ticket = $("ticket"), nameEl = $("name");
nameEl.value = localStorage.getItem("bear_name") || "";
nameEl.addEventListener("input", () => {
  localStorage.setItem("bear_name", nameEl.value.trim());
  $("server").classList.remove("need");
});
nameEl.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); text.focus(); } });
let sending = false, heardUntil = 0;

// ---- ticket set dressing -----------------------------------------------------
function newTicket() {
  $("num").textContent = "#" + String(Math.floor(Math.random() * 9000) + 1000);
  $("time").textContent = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}
newTicket();

for (const c of CHIPS) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = c;
  b.onclick = () => { text.value = c.toUpperCase(); onInput(); };
  $("chips").appendChild(b);
}
function onInput() {
  const n = text.value.length;
  $("n").textContent = n > 50 ? `${n}/80` : "";
  render();
}
text.addEventListener("input", onInput);
text.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});

// ---- board status ------------------------------------------------------------
let base = null;  // {remaining, running, guests, at}

function online() {
  if (!base) return true;  // unknown yet: let them try
  return Date.now() - base.at < STALE_MS && base.guests !== false;
}

function cooldownLeft() {
  return Math.max(0, Math.ceil(((+localStorage.getItem("bear_until") || 0) - Date.now()) / 1000));
}

// Single place that decides what the button and clock show.
function render() {
  const cd = cooldownLeft();
  let label = "FIRE", disabled = false, cls = "";
  if (sending) { label = "···"; disabled = true; }
  else if (Date.now() < heardUntil) { label = "HEARD"; disabled = true; cls = "heard"; }
  else if (!online()) { label = "86'D"; disabled = true; }
  else if (cd) { label = `0:${String(cd).padStart(2, "0")}`; disabled = true; }
  fire.textContent = label;
  fire.disabled = disabled;
  fire.className = "fire " + cls;

  const clock = $("clock");
  if (!base) return;
  const stale = Date.now() - base.at >= STALE_MS;
  const el = base.running ? (Date.now() - base.at) / 1000 : 0;
  const s = Math.max(0, Math.ceil(base.remaining - el));
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = s % 60;
  $("digits").textContent = `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(ss).padStart(2, "0")}`;
  clock.className = "clock" + (stale ? " stale" : !base.running ? " paused" : s === 0 ? " zero" : "");
}
setInterval(render, 250);

function accept(st, atMs) {
  if (typeof st.remaining !== "number") return;
  base = { remaining: st.remaining, running: !!st.running, guests: st.guests, at: atMs };
  render();
}

function onNtfyLine(line) {
  try {
    const m = JSON.parse(line);
    // ntfy time is whole seconds; never let a reading appear to come from the future.
    if (m.event === "message") accept(JSON.parse(m.message), Math.min(m.time * 1000, Date.now()));
  } catch (e) {}
}

if (LOCAL) {
  (async function poll() {
    try {
      const r = await fetch("/api/state", { cache: "no-store" });
      accept(await r.json(), Date.now());
    } catch (e) {}
    setTimeout(poll, 2000);
  })();
} else {
  const topic = `${GUEST_TOPIC}-status`;
  fetch(`${NTFY}/${topic}/json?poll=1&since=latest`).then((r) => r.text())
    .then((b) => { const l = b.trim().split("\n").pop(); if (l) onNtfyLine(l); }).catch(() => {});
  new EventSource(`${NTFY}/${topic}/sse`).onmessage = (ev) => onNtfyLine(ev.data);
}

// ---- send --------------------------------------------------------------------
function fail() {
  ticket.classList.remove("err");
  void ticket.offsetWidth;
  ticket.classList.add("err");
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const t = text.value.trim().replace(/\s+/g, " ").toUpperCase();
  const n = nameEl.value.trim().replace(/\s+/g, " ").toUpperCase();
  if (fire.disabled) return;
  if (!n) { $("server").classList.add("need"); fail(); nameEl.focus(); return; }
  if (!t) { fail(); text.focus(); return; }
  sending = true;
  render();
  try {
    const body = JSON.stringify({ n, t });
    const r = await fetch(LOCAL ? "/api/msg" : `${NTFY}/${GUEST_TOPIC}`, { method: "POST", body });
    if (!r.ok) throw new Error(r.status);
    localStorage.setItem("bear_until", Date.now() + COOLDOWN_S * 1000);
    navigator.vibrate?.(30);
    text.blur();
    ticket.classList.add("fired");
    setTimeout(() => {
      ticket.classList.remove("fired");
      text.value = "";
      onInput();
      newTicket();
      ticket.classList.add("fresh");
      setTimeout(() => ticket.classList.remove("fresh"), 500);
    }, 560);
    heardUntil = Date.now() + 1800;
  } catch (err) {
    fail();
  }
  sending = false;
  render();
});

// ---- staff photo + the wall ---------------------------------------------------
// The phone composes a taped-up Polaroid (name on blue tape, clock stamp). Guests
// can keep it, and/or tape it to the wall: an ntfy topic with photo attachments
// (2 MB each, they expire after 3 h). Admin hides photos via the -hide topic.
const WALL = `${GUEST_TOPIC}-wall`;
const WALL_HIDE = `${WALL}-hide`;
const MARKER = '"Marker Felt", "Noteworthy", "Chalkboard SE", system-ui, sans-serif';
const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';
let card = null;  // {blob, url, name} for the open sheet

function needName() {
  const n = nameEl.value.trim().replace(/\s+/g, " ").toUpperCase();
  if (!n) { $("server").classList.add("need"); fail(); nameEl.focus(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  return n;
}

function loadImage(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

// Strip of blue painter's tape with torn ends, drawn at the origin.
function tape(ctx, w, h) {
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(w, 0);
  for (let i = 1; i <= 6; i++) ctx.lineTo(w - (i % 2 ? 7 : 0), (h * i) / 6);
  ctx.lineTo(0, h);
  for (let i = 5; i >= 0; i--) ctx.lineTo(i % 2 ? 7 : 0, (h * i) / 6);
  ctx.closePath();
  ctx.fillStyle = "rgba(61,127,217,.96)";
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.10)";
  ctx.fillRect(0, 0, w, h * 0.35);
}

let grainCanvas = null;
function grain() {
  if (grainCanvas) return grainCanvas;
  grainCanvas = document.createElement("canvas");
  grainCanvas.width = grainCanvas.height = 160;
  const g = grainCanvas.getContext("2d"), d = g.createImageData(160, 160);
  for (let i = 0; i < d.data.length; i += 4) {
    const v = Math.random() * 255;
    d.data[i] = d.data[i + 1] = d.data[i + 2] = v;
    d.data[i + 3] = 255;
  }
  g.putImageData(d, 0, 0);
  return grainCanvas;
}

async function makeCard(file, name) {
  const img = await loadImage(file);
  const W = 1080, H = 1350, PW = 880, PH = 1080, PH0 = 792;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#07090d";
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(W / 2, H / 2 + 20);
  ctx.rotate(((Math.random() * 4 - 2) * Math.PI) / 180);
  ctx.translate(-PW / 2, -PH / 2);

  // paper
  ctx.shadowColor = "rgba(0,0,0,.65)"; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
  ctx.fillStyle = "#f4f1ea";
  ctx.fillRect(0, 0, PW, PH);
  ctx.shadowColor = "transparent";

  // photo: cover-crop, biased up a bit to keep faces
  const px = 44, py = 44, ps = PH0;
  const sc = Math.max(ps / img.naturalWidth, ps / img.naturalHeight);
  const sw = ps / sc, sh = ps / sc;
  ctx.save();
  ctx.beginPath(); ctx.rect(px, py, ps, ps); ctx.clip();
  ctx.drawImage(img, (img.naturalWidth - sw) / 2, (img.naturalHeight - sh) * 0.35, sw, sh, px, py, ps, ps);
  // kitchen grade: warm, a little crushed, grainy, vignetted
  ctx.globalCompositeOperation = "soft-light";
  ctx.fillStyle = "rgba(255,170,90,.35)"; ctx.fillRect(px, py, ps, ps);
  ctx.globalCompositeOperation = "overlay";
  ctx.globalAlpha = 0.10;
  ctx.fillStyle = ctx.createPattern(grain(), "repeat"); ctx.fillRect(px, py, ps, ps);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "multiply";
  const v = ctx.createRadialGradient(px + ps / 2, py + ps / 2, ps * 0.35, px + ps / 2, py + ps / 2, ps * 0.75);
  v.addColorStop(0, "rgba(255,255,255,1)"); v.addColorStop(1, "rgba(60,50,45,1)");
  ctx.fillStyle = v; ctx.fillRect(px, py, ps, ps);
  ctx.restore();
  URL.revokeObjectURL(img.src);

  // caption: the clock at the moment of the photo, LED blue
  const clockStr = base ? $("digits").textContent : "YES CHEF";
  ctx.font = `700 96px ${MONO}`;
  ctx.fillStyle = "#2f7bff";
  ctx.shadowColor = "rgba(47,123,255,.75)"; ctx.shadowBlur = 22;
  ctx.fillText(clockStr, px + 4, py + ps + 128);
  ctx.shadowColor = "transparent";
  ctx.font = `600 24px ${MONO}`;
  ctx.fillStyle = "rgba(23,24,27,.55)";
  const d = new Date();
  ctx.fillText(`THE BEAR · ${d.getMonth() + 1}.${d.getDate()}.${String(d.getFullYear()).slice(2)}`, px + 8, py + ps + 186);

  // name on tape across the top edge
  ctx.font = `700 60px ${MARKER}`;
  const tw = Math.max(260, ctx.measureText(name).width + 90);
  ctx.save();
  ctx.translate(PW / 2 - tw / 2 - 30, -34);
  ctx.rotate((-3.5 * Math.PI) / 180);
  tape(ctx, tw, 92);
  ctx.fillStyle = "#0b1220";
  ctx.textBaseline = "middle";
  ctx.fillText(name, 45, 50);
  ctx.restore();
  // a plain strip holding the bottom-right corner
  ctx.save();
  ctx.translate(PW - 130, PH - 95);
  ctx.rotate((40 * Math.PI) / 180);
  tape(ctx, 210, 58);
  ctx.restore();

  ctx.restore();
  const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.86));
  return { blob, url: URL.createObjectURL(blob), name };
}

function openSheet(src, canTape) {
  $("preview").src = src;
  $("tapeUp").hidden = !canTape;
  $("tapeUp").disabled = false;
  $("tapeUp").textContent = "TAPE IT UP";
  $("sheet").hidden = false;
}
function closeSheet() {
  $("sheet").hidden = true;
  $("sheet").classList.remove("busy");
  if (card) { URL.revokeObjectURL(card.url); card = null; }
}
$("sheetX").onclick = closeSheet;

$("snap").onclick = () => { if (needName()) $("cam").click(); };
$("cam").onchange = async () => {
  const f = $("cam").files[0];
  $("cam").value = "";
  if (!f) return;
  try {
    card = await makeCard(f, needName());
    openSheet(card.url, true);
  } catch (e) {
    fail();
  }
};

$("keep").onclick = async () => {
  const src = $("preview").src;
  const blob = card ? card.blob : await (await fetch(src)).blob();
  const file = new File([blob], "the-bear-staff-photo.jpg", { type: "image/jpeg" });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file] }); } catch (e) {}
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = file.name;
  a.click();
};

$("tapeUp").onclick = async () => {
  if (!card) return;
  const b = $("tapeUp");
  b.disabled = true;
  b.textContent = "···";
  $("sheet").classList.add("busy");
  try {
    const q = `filename=staff-photo.jpg&message=${encodeURIComponent(card.name)}`;
    // Untyped Blob keeps this a CORS "simple" request (no preflight).
    const r = await fetch(`${NTFY}/${WALL}?${q}`, { method: "PUT", body: new Blob([card.blob]) });
    if (!r.ok) throw new Error(r.status);
    navigator.vibrate?.(30);
    closeSheet();
    $("wall").scrollIntoView({ behavior: "smooth" });
  } catch (e) {
    b.disabled = false;
    b.textContent = "TRY AGAIN";
    $("sheet").classList.remove("busy");
  }
};

const photos = new Map();  // id -> {url, name, time, expires}
const hidden = new Set();
function renderWall() {
  const now = Date.now() / 1000;
  const list = [...photos.entries()]
    .filter(([id, p]) => !hidden.has(id) && p.expires > now)
    .sort((a, b) => b[1].time - a[1].time);
  $("wall").hidden = list.length === 0;
  const grid = $("grid");
  grid.replaceChildren(...list.map(([id, p]) => {
    const img = document.createElement("img");
    img.src = p.url;
    img.alt = p.name;
    img.loading = "lazy";
    img.onclick = () => openSheet(p.url, false);
    img.onerror = () => { photos.delete(id); img.remove(); };
    return img;
  }));
}
function onWallLine(line) {
  try {
    const m = JSON.parse(line);
    if (m.event !== "message") return;
    if (m.topic === WALL_HIDE) hidden.add(m.message.trim());
    else if (m.attachment) photos.set(m.id, { url: m.attachment.url, name: m.message, time: m.time, expires: m.attachment.expires });
  } catch (e) {}
}
function subscribeWall() {
  const topics = `${WALL},${WALL_HIDE}`;
  fetch(`${NTFY}/${topics}/json?poll=1&since=all`).then((r) => r.text()).then((b) => {
    b.split("\n").forEach(onWallLine);
    renderWall();
  }).catch(() => {});
  new EventSource(`${NTFY}/${topics}/sse`).onmessage = (ev) => { onWallLine(ev.data); renderWall(); };
  setInterval(renderWall, 60000);  // drop expired photos
}

if (LOCAL) $("snap").hidden = true;  // no internet on the board's hotspot
else subscribeWall();
</script>
