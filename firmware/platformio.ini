; Seengreat / WatangTech "RGB Matrix HUB75 S3" (ESP32-S3-WROOM-1-N16R8)
; Upload: plug the board's USB-C (the one labeled for download, not "Power"),
; then `pio run -t upload -t monitor` from this folder.
[env:bear]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = pre:tools/embed_web.py
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DNO_GFX=1
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.0.12
  bblanchon/ArduinoJson@^7.2.0
